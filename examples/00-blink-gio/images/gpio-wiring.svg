<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>LAUNCHXL2-570LC43 user LEDs and buttons on GIOB</title>
  <desc>GIOB6 and GIOB7 drive LED A and LED B through 2.2 kilohm resistors to ground. GIOB4 and GIOB5 read button A and button B, each pulled up to 3.3 V through 2.2 kilohms and shorted to ground when pressed.</desc>

  <rect width="780" height="470" rx="14" fill="#0d1117"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#e6edf3">GPIO map: user LEDs and buttons</text>
  <text x="30" y="62" font-size="13" fill="#8b949e">LAUNCHXL2-570LC43 · all four signals are on port GIOB of the TMS570LC4357</text>

  <!-- MCU block -->
  <rect x="30" y="90" width="170" height="350" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="115" y="122" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">TMS570LC4357</text>
  <text x="115" y="141" font-size="12" fill="#8b949e" text-anchor="middle">GIOB port</text>

  <!-- section labels -->
  <text x="270" y="108" font-size="12" font-weight="700" fill="#3fb950" letter-spacing="1">OUTPUTS (LEDs)</text>
  <text x="270" y="258" font-size="12" font-weight="700" fill="#58a6ff" letter-spacing="1">INPUTS (BUTTONS)</text>

  <g stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ===== Output: GIOB7 -> LED B (y=150) ===== -->
    <line x1="200" y1="150" x2="330" y2="150"/>
    <polygon points="330,138 330,162 352,150" fill="#161b22" stroke="#3fb950"/>
    <line x1="352" y1="138" x2="352" y2="162" stroke="#3fb950"/>
    <line x1="352" y1="150" x2="430" y2="150"/>
    <rect x="430" y="142" width="60" height="16" fill="#161b22"/>
    <line x1="490" y1="150" x2="560" y2="150"/>
    <line x1="560" y1="150" x2="560" y2="166"/>
    <line x1="548" y1="166" x2="572" y2="166"/><line x1="552" y1="171" x2="568" y2="171"/><line x1="556" y1="176" x2="564" y2="176"/>

    <!-- ===== Output: GIOB6 -> LED A (y=215) ===== -->
    <line x1="200" y1="215" x2="330" y2="215"/>
    <polygon points="330,203 330,227 352,215" fill="#161b22" stroke="#3fb950"/>
    <line x1="352" y1="203" x2="352" y2="227" stroke="#3fb950"/>
    <line x1="352" y1="215" x2="430" y2="215"/>
    <rect x="430" y="207" width="60" height="16" fill="#161b22"/>
    <line x1="490" y1="215" x2="560" y2="215"/>
    <line x1="560" y1="215" x2="560" y2="231"/>
    <line x1="548" y1="231" x2="572" y2="231"/><line x1="552" y1="236" x2="568" y2="236"/><line x1="556" y1="241" x2="564" y2="241"/>

    <!-- ===== Input: GIOB5 -> button B (y=340) ===== -->
    <line x1="200" y1="340" x2="400" y2="340"/>
    <circle cx="300" cy="340" r="3.5" fill="#8b949e"/>
    <line x1="300" y1="340" x2="300" y2="318"/>
    <rect x="292" y="296" width="16" height="22" fill="#161b22"/>
    <line x1="300" y1="296" x2="300" y2="284"/>
    <line x1="288" y1="284" x2="312" y2="284" stroke="#d29922"/>
    <circle cx="400" cy="340" r="4" fill="#161b22" stroke="#58a6ff"/>
    <circle cx="450" cy="340" r="4" fill="#161b22" stroke="#58a6ff"/>
    <line x1="400" y1="340" x2="446" y2="324" stroke="#58a6ff"/>
    <line x1="450" y1="340" x2="560" y2="340"/>
    <line x1="560" y1="340" x2="560" y2="356"/>
    <line x1="548" y1="356" x2="572" y2="356"/><line x1="552" y1="361" x2="568" y2="361"/><line x1="556" y1="366" x2="564" y2="366"/>

    <!-- ===== Input: GIOB4 -> button A (y=425) ===== -->
    <line x1="200" y1="425" x2="400" y2="425"/>
    <circle cx="300" cy="425" r="3.5" fill="#8b949e"/>
    <line x1="300" y1="425" x2="300" y2="403"/>
    <rect x="292" y="381" width="16" height="22" fill="#161b22"/>
    <line x1="300" y1="381" x2="300" y2="372"/>
    <line x1="288" y1="372" x2="312" y2="372" stroke="#d29922"/>
    <circle cx="400" cy="425" r="4" fill="#161b22" stroke="#58a6ff"/>
    <circle cx="450" cy="425" r="4" fill="#161b22" stroke="#58a6ff"/>
    <line x1="400" y1="425" x2="446" y2="409" stroke="#58a6ff"/>
    <line x1="450" y1="425" x2="560" y2="425"/>
    <line x1="560" y1="425" x2="560" y2="441"/>
    <line x1="548" y1="441" x2="572" y2="441"/><line x1="552" y1="446" x2="568" y2="446"/><line x1="556" y1="451" x2="564" y2="451"/>
  </g>

  <!-- resistor outlines (drawn on top of the boxes) -->
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <rect x="430" y="142" width="60" height="16"/>
    <rect x="430" y="207" width="60" height="16"/>
    <rect x="292" y="296" width="16" height="22"/>
    <rect x="292" y="381" width="16" height="22"/>
  </g>

  <!-- pin labels (inside MCU block) -->
  <g font-size="14" font-weight="700" fill="#e6edf3" text-anchor="end">
    <text x="190" y="155">GIOB7</text>
    <text x="190" y="220">GIOB6</text>
    <text x="190" y="345">GIOB5</text>
    <text x="190" y="430">GIOB4</text>
  </g>

  <!-- component labels -->
  <g font-size="12" fill="#8b949e" text-anchor="middle">
    <text x="341" y="128" fill="#3fb950" font-weight="700">LED B</text>
    <text x="341" y="193" fill="#3fb950" font-weight="700">LED A</text>
    <text x="460" y="136">2.2 kΩ</text>
    <text x="460" y="201">2.2 kΩ</text>
    <text x="425" y="312" fill="#58a6ff" font-weight="700">Button B</text>
    <text x="425" y="397" fill="#58a6ff" font-weight="700">Button A</text>
  </g>
  <g font-size="12" fill="#8b949e">
    <text x="318" y="311">2.2 kΩ</text>
    <text x="318" y="396">2.2 kΩ</text>
    <text x="318" y="288" fill="#d29922" font-weight="700">3.3 V</text>
    <text x="318" y="376" fill="#d29922" font-weight="700">3.3 V</text>
    <text x="582" y="171">GND</text>
    <text x="582" y="236">GND</text>
    <text x="582" y="361">GND</text>
    <text x="582" y="446">GND</text>
  </g>

  <!-- behavior notes -->
  <g font-size="13" fill="#e6edf3">
    <text x="620" y="150" fill="#3fb950" font-weight="700">GIOB7</text>
    <text x="620" y="168" fill="#8b949e">high = LED B on</text>
    <text x="620" y="215" fill="#3fb950" font-weight="700">GIOB6</text>
    <text x="620" y="233" fill="#8b949e">high = LED A on</text>
    <text x="620" y="340" fill="#58a6ff" font-weight="700">GIOB5</text>
    <text x="620" y="358" fill="#8b949e">low = pressed</text>
    <text x="620" y="425" fill="#58a6ff" font-weight="700">GIOB4</text>
    <text x="620" y="443" fill="#8b949e">low = pressed</text>
  </g>
</svg>
